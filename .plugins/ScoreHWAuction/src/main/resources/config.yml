# ╔═══════════════════════════════════════════════════════╗
# ║          ScoreHWAuction  config.yml  v1.0.0          ║
# ╚═══════════════════════════════════════════════════════╝

debug: false

# ─── Database ───────────────────────────────────────────
database:
  # sqlite | mysql
  type: sqlite
  sqlite:
    file: auction.db
  mysql:
    host: localhost
    port: 3306
    database: auction
    username: root
    password: password
    pool-size: 10
    min-idle: 2
    connection-timeout: 30000
    idle-timeout: 600000
    max-lifetime: 1800000

# ─── Feature Toggles ────────────────────────────────────
features:
  # /ah search command — search by item name
  search: true
  # /ah player command — filter by seller name
  player-filter: true
  # Bid/auction mode (/ah sell war)
  bid-auction: true
  # /ah sell auto — auto-price from market
  auto-sell: true
  # Automatically hard-delete old expired listings
  expired-cleaner: true
  # Hours after expiry before an item is permanently deleted from expired list
  expired-cleanup-delay-hours: 72

# ─── Anti-Lag / Protection ──────────────────────────────
protection:
  # Minimum milliseconds between GUI clicks per player (0 = disabled)
  click-cooldown-ms: 250

# ─── Auction Core ───────────────────────────────────────
auction:
  # Fallback slot limit when player has no scoreah.maxlots.N permission
  default-max-lots: 5
  # Tax fraction deducted from seller payout (0.05 = 5%)
  tax: 0.05
  min-price: 1.0
  max-price: 999999999.0
  default-duration-hours: 48
  # Bounds for bid-auction time
  auction-min-time: 1
  auction-max-time: 72
  # Items per page (max 45)
  items-per-page: 45
  allow-per-unit: true
  enable-sounds: true
  broadcast-purchase: false
  allow-self-buy: false
  currency-symbol: "α"

  # ── Auto-sell ──────────────────────────────────────────
  # Markup % ABOVE the cheapest market price for auto-sell suggestion
  # (positive = slightly more expensive than cheapest; use negative to undercut)
  auto-sell-markup-percent: 5.0
  # Fallback price-per-unit multiplier when no market listings exist
  auto-price-multiplier: 1.0
  # Seconds the /ah sell auto confirm prompt stays valid
  auto-sell-confirm-timeout: 30

  # ── Bid / Auction ──────────────────────────────────────
  # Default bid-step as % of starting price
  default-step-percent: 10.0
  # Max single-click step jump (e.g. 5 = up to 5 steps in one click)
  bid-steps-ahead: 5
  bid-steps-ahead-cap: 10

  # Time extension per bid (adds time to the auction when someone bids)
  bid-time-extension:
    enabled: true
    seconds: 30

  # Materials blocked from listing
  blacklist:
    - BEDROCK
    - COMMAND_BLOCK
    - CHAIN_COMMAND_BLOCK
    - REPEATING_COMMAND_BLOCK
    - BARRIER
    - STRUCTURE_BLOCK
    - STRUCTURE_VOID
    - JIGSAW

