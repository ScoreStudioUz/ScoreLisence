# Shields menyusidagi sahifa strelkalari (slot 47 = oldingi, 51 = keyingi) uchun
# custom_model_data — resource pack shu qiymatga strelka modelini bog'laydi.
# 0 qilib qo'ysangiz CMD stamp qilinmaydi (oddiy ARROW ko'rinadi).
