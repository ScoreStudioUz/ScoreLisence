# ─────────────────────────────────────────────────────────────────────────────
#  Nishonlar (NameTags / badges) — nik oldidagi emoji
#
#  O'yinchi nik oldiga qo'yiladigan emoji/belgi (nishon) tanlaydi. Natijada nik
#  HAMMA YERDA "(emoji) SHOXMONEY" ko'rinishida chiqadi.
#
#  Nishonlar KUMUSHga sotib olinadi. Sotib olingandan keyin bepul yoqiladi.
#
#  Har bir yozuv:
#    <id>:
#      name:        menyuda ko'rinadigan nom (odatda emoji rangli)
#      tag:         nik oldiga qo'shiladigan matn/emoji (rang kodlari bilan)
#      price:       narxi (kumush). 0 = bepul.
#      slot:        nishonlar menyusidagi o'rni (0..53)
#      permission:  (ixtiyoriy) — berilsa, bu nishon PUL to'lamasdan ochiq bo'ladi
#      icon:        (ixtiyoriy) menyu ikonkasi — berilmasa emoji NAME_TAG da chiqadi
#
#  Emoji ko'rinishi uchun resource-pack/clientda mos shrift bo'lishi kerak.
# ─────────────────────────────────────────────────────────────────────────────
# Nik bilan emoji orasidagi ajratuvchi (tag dan keyin qo'shiladi).
separator: " "

# Rang tanlagich (name-color menu) shu nechta nishon olingandan keyin ochiladi.
namecolor-unlock-after: 21

