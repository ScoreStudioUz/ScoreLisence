# ── Block messages (styled multi-line) ────────────────────────────────────────
# Each "lines" list is sent verbatim. Lines prefixed with "%accuracy%" or
# "%view%" are dropped unless the player has the matching permission.
# The {stats_view} placeholder on a line is rendered as a hoverable
# "[посмотреть]" component built from `stats-tooltip` below.
round-finished:
  header:
    - ""
    - "&6➥ &fРаунд завершён &7#{round}"
    - ""
  winner-line: "&6↾ &fПобедил: &b{winner} &c{hp}&c💔"
  score-line:  "&6▏ &fСчёт: &a{winner_score} &7⋎ &c{loser_score}"
  accuracy-line: "&6⇂ &fТочность: &e{accuracy}%"
  stats-line:    "&6⇂ &fСтатистика: &b{stats_view}"
  view-text:     "&b[посмотреть]"
  view-hover:    "&7Нажмите, чтобы посмотреть статистику"

duel-finished:
  header:
    - ""
    - "&6➥ &fДуэль завершена &c🗡"
    - ""
  winner-line: "&6↾ &fПобедил: &b{winner} &c{hp}&c💔"
  score-line:  "&6▏ &fСчёт: &a{winner_score} &7⋎ &c{loser_score}"
  stats-line:  "&6⇂ &fСтатистика: &b{stats_view}"
  view-text:   "&b[посмотреть]"
  view-hover:  "&7Нажмите, чтобы посмотреть статистику"

# Hover tooltip rendered when the player hovers over [посмотреть].
