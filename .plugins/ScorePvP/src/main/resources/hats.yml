# ─────────────────────────────────────────────────────────────────────────────
#  ScorePvP — Hats (kosmetik shlyapalar)
#
#  Ported from HopliteCosmetics. Hats render via custom_model_data on a base
#  COAL item, resolved client-side by the ScoreCosmetics resource pack. Access
#  to each hat is a permission node (scorepvp.hat.<id>); scorepvp.hats.all
#  unlocks every hat at once.
#
#  In the lobby the chosen hat is worn in the helmet slot (freely removable,
#  restored on lobby entry). In a duel the hat's custom_model_data is stamped
#  onto whatever helmet the kit gives, so full armor + enchants are preserved
#  and the RP still shows the hat model — the diamond_helmet / netherite_helmet
#  item models in the RP must carry the same overrides for this to render.
# ─────────────────────────────────────────────────────────────────────────────

resource-pack:
  # Send the ScoreCosmetics resource pack on join. If mandatory, players who
  # decline / fail to download are kicked.
  enabled: true
  mandatory: true
  # DIQQAT: RP repo ildizidagi UzTiers.-.RP.zip. Unga oltin bosh (golden head)
  # modeli qo'shildi: honey_bottle + custom_model_data:1 -> "oltin_bosh" 3D bosh
  # modeli. Shu sababli zip QAYTA qadoqlandi va sha1 o'zgardi. Zipni hostingga
  # QAYTA YUKLANG, so'ng quyidagi url'ni yangi to'g'ridan-to'g'ri havolaga
  # almashtiring (sha1 pastda yangilangan).
  url: "https://funmoney.alwaysdata.net/d/b5de26ca75812884ee67c5c6df6083d37e61f987334ddacfef2a193398b99e07/stream"
  sha1: "443d0280766b3d22bb317145aca0c9f2c1902826"
  prompt-message: "&6&l[RP] &r&7O'ynash uchun resurs paket kerak. Iltimos, qabul qiling!"
  decline-kick-message: |
    &c&lResurs paket majburiy!
    &7Serverga kirish uchun resurs paketni qabul qilishingiz kerak.
  failed-kick-message: |
    &c&lResurs paket yuklanmadi!
    &7Internet aloqangizni tekshirib qayta urinib ko'ring.
  not-loaded-message: "&c/hats dan foydalanish uchun avval resurs paketni yuklang!"

gui:
  title: "&8Shlyapalar"
  remove-hat-name: "&c&lShlyapani yechish"
  remove-hat-lore:
    - "&7Kiyilgan shlyapangizni yechadi."
  filler-material: GRAY_STAINED_GLASS_PANE
  prev-page-name: "&e&l« Oldingi sahifa"
  next-page-name: "&e&lKeyingi sahifa »"
  page-indicator-name: "&6&lSahifa {page}/{total}"
  lore-equipped: "&a&l✔ Kiyilgan"
  lore-unlocked: "&7Kiyish uchun bosing"
  lore-locked: "&cQulflangan"

messages:
  hat-equipped: "&aSiz &6{hat}&a shlyapasini kiydingiz!"
  hat-removed: "&7Shlyapa yechildi."
  no-permission: "&cBu shlyapa siz uchun ochilmagan."
  reload-success: "&aHats config qayta yuklandi."

# ─────────────────────────────────────────────────────────────────────────────
#  DO'KON (shop) — hatlar 3 turga (category) bo'linadi. Har turning narxi va
#  do'kon menyusidagi ikonasi shu yerda. Har bir hatning qaysi turda turishi
#  pastdagi "hats:" bo'limida har hatning "category:" maydonida belgilanadi —
#  uni erkin o'zgartirishingiz mumkin (uncommon / rare / legendary).
#
#  Sotib olish: kumushga (silver) sotiladi YOKI scorepvp.hat.<id> / scorepvp.hats.all
#  ruxsati bo'lsa bepul ochiq. Sotib olingach hat DB'da saqlanadi (player_hats).
# ─────────────────────────────────────────────────────────────────────────────
shop:
  title: "&8Shlyapalar do'koni"
  # Do'kon menyusidagi 3 category tugmasi turadigan slotlar (mockupdagi 3,4,5).
  filler-material: BLACK_STAINED_GLASS_PANE
  # Pastki boshqaruv qatori
  exit-slot: 49
  exit-name: "&c&lChiqish"
  prev-slot: 48
  prev-name: "&e&l« Oldingi sahifa"
  next-slot: 50
  next-name: "&e&lKeyingi sahifa »"
  # Prev/next tugmalarining custom_model_data qiymati (resurs paketdagi
  # ARROW modellari): 9002 = chapga (oldingi), 9001 = o'ngga (keyingi).
  # 0 qoldirsangiz oddiy vanilla ARROW ko'rinadi.
  prev-custom-model-data: 9002
  next-custom-model-data: 9001
  # Hat ikonalari joylashadigan slotlar (0..44). Category tugmalari ustidagilar
  # bundan chiqarib tashlanadi.
  lore-equipped: "&a&l✔ O'rnatilgan"
  lore-owned: "&7O'rnatish uchun bosing"
  lore-locked: "&cSotib olinmagan"
  lore-price: "&7Narxi: &f{price} &7kumush"
  # Sotib olish tasdiq oynasi (nishondek)
  confirm-title: "&8Sotib olishni tasdiqlang"
  confirm-cancel: "&c&lBekor qilish"
  confirm-info: "&e{hat}"
  confirm-price: "&7Narxi: &f{price} &7kumush"
  confirm-accept: "&a&lSotib olish"
  # Xabarlar
  bought: "&aSiz &6{hat}&a shlyapasini sotib oldingiz!"
  not-enough: "&cKumush yetarli emas! Kerak: &f{price}&c."
  equipped: "&aSiz &6{hat}&a shlyapasini o'rnatdingiz!"

# Uch tur (category). slot = do'kon menyusidagi ikona joyi (mockup: 3,4,5).
# price = shu turdagi HAR hatning narxi.
# preview-hat = shu tur tugmasi qaysi shlyapa modelini ko'rsatishi (pastdagi
#   "hats:" dan biror id). Bo'sh qoldirsangiz "icon" materiali ishlatiladi.
# icon = preview-hat bo'sh bo'lsa ishlatiladigan zaxira material.
categories:
  uncommon:
    display-name: "&f&lOddiy"
    price: 1500
    preview-hat: king_crown
    icon: IRON_INGOT
    slot: 3
  rare:
    display-name: "&b&lKamyob"
    price: 2500
    preview-hat: warden_horns
    icon: GOLD_INGOT
    slot: 4
  legendary:
    display-name: "&6&lAfsonaviy"
    price: 5000
    preview-hat: artemis_crown
    icon: DIAMOND
    slot: 5

