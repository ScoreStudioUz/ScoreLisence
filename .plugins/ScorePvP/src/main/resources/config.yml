# ============================================================
#                    ScorePvP Configuration
# ============================================================

# Язык плагина: ru / uz
# ru — Русский
# uz — O'zbekcha (SmallCaps)
language: ru

# Показывать ли [ScorePvP] перед сообщениями в чате
use-plugin-prefix: false

# ── Storage ───────────────────────────────────────────────────────────────────
# Split storage: tiers могут жить в общей MySQL на всю сеть серверов,
# а stats / playtime / settings / friends всегда локально в SQLite (scorepvp.db).
# Арены — файлы data-arena/<n>.yml. Личные ванильные киты — data-player/<uuid>.yml.
storage:
  tiers:
    # sqlite — локальный файл tiers.db
    # mysql  — общий сервер; при ошибке стартапа автоматически откатывается на SQLite
    type: mysql
    mysql:
      host: mysql-uztiers.alwaysdata.net
      port: 3306
      database: uztiers_tiers
      username: uztiers_scorepvp
      password: shohjahon1
      pool-size: 4
      connection-timeout: 5000
      # ── Idle-connection tuning ──────────────────────────────────────────────
      # MySQL serveri (masalan alwaysdata) bo'sh (idle) connectionlarni o'zining
      # wait_timeout'idan keyin yopadi. Shundан keyin plagin eski connectionni
      # ishlatsa "No operations allowed after connection closed" xatosini beradi
      # va tierlar ishlamay qoladi. Buni oldini olish uchun:
      #   • max-lifetime-ms  — connection shundan oshsa yangilanadi. Server
      #                        wait_timeout'idan KICHIK bo'lishi shart.
      #   • keepalive-ms     — connection bo'sh turmasligi uchun vaqti-vaqti bilan
      #                        "ping" yuboriladi (max-lifetime'dan kichik).
      #   • idle-timeout-ms  — ortiqcha bo'sh connectionlar shundan keyin yopiladi.
      # Agar serveringizning wait_timeout'i uzoq bo'lsa bu qiymatlarni oshiring.
      max-lifetime-ms: 60000
      keepalive-ms: 30000
      idle-timeout-ms: 45000

