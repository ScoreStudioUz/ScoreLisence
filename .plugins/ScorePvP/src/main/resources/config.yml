# ============================================================
#                    ScorePvP Configuration
# ============================================================

# Язык плагина: ru / uz
# ru — Русский
# uz — O'zbekcha (SmallCaps)
language: "ru"

# Показывать ли [ScorePvP] перед сообщениями в чате
use-plugin-prefix: true

database:
  # Тип базы данных: mysql или sqlite
  # mysql  — основная; при недоступности автоматически переключается на SQLite
  # sqlite — локальная БД, не требует сервера
  type: sqlite
  mysql:
    host: "localhost"
    port: 3306
    database: "scorepvp"
    username: "root"
    password: "password"
    pool-size: 10
    connection-timeout: 5000

# Spawn warp — slot 9 (hotbar index 8)
warp:
  world: "world"
  x: 0.5
  y: 64.0
  z: 0.5
  yaw: 0.0
  pitch: 0.0

# TP Spawn — where players teleport after a match ends (Duel, FFA, PvP)
# If not set, falls back to the warp location above.
tp-spawn:
  world: ""
  x: 0.5
  y: 64.0
  z: 0.5
  yaw: 0.0
  pitch: 0.0

# Chest region — only players in this box interact with managed chests
chest-region:
  world: "world"
  min-x: -50
  min-y: 60
  min-z: -50
  max-x: 50
  max-y: 80
  max-z: 50

# Hotbar items given on join
hotbar:
  slot-0:
    material: IRON_SWORD
    name: "&c&lБоевые режимы"
    lore:
      - "&7Нажмите для открытия меню"
  slot-1:
    material: NETHER_STAR
    name: "&b&lПати"
    lore:
      - "&7Нажмите для управления пати"
  slot-7:
    material: GRINDSTONE
    name: "&e&lНастройки"
    lore:
      - "&7Нажмите для открытия настроек"
  slot-8:
    material: ENDER_PEARL
    name: "&a&lВанильный режим"
    lore:
      - "&7Телепортация в ванильный регион"

# Tier hierarchy (weak → strong)
tiers:
  order:
    - LT5
    - HT5
    - LT4
    - HT4
    - LT3
    - HT3
    - LT2
    - HT2
    - LT1
    - HT1
  colors:
    LT5: "&7"
    HT5: "&f"
    LT4: "&a"
    HT4: "&2"
    LT3: "&b"
    HT3: "&3"
    LT2: "&e"
    HT2: "&6"
    LT1: "&c"
    HT1: "&4"

# ── Party settings ─────────────────────────────────────────────────────────────
party:
  max-members: 10
  invite-expire-seconds: 60
  ffa-min-members: 2
  disband-on-owner-disconnect: true
  chat-prefix: "&8[&bParty&8] "

# ── Match settings ─────────────────────────────────────────────────────────────
match:
  countdown: 5
  round-end-delay-ticks: 60
  finish-delay-ticks: 60

# ── Commands (configurable, like DeluxeMenus) ──────────────────────────────────
commands:
  party-ffa-menu: "party ffa"
  pvp-menu: "pvpmenu"
  profile: "profile"
  duel: "duel"
  spec: "spec"
  leave: "leave"
  arena: "arena"

# ── Arena restore (vanilla type) ──────────────────────────────────────────────
arena:
  vanilla-restore-delay-ticks: 60
  restore-blocks-per-tick: 500
  restore-async: true
  restore-notify-players: true
  save-tile-entities: true
  retry-search-ticks: 100        # ticks between arena search retries
  match-timeout-minutes: 30
  stuck-arena-check-minutes: 5
  search-timeout-seconds: 60

# ── Friends ────────────────────────────────────────────────────────────────────
friends:
  max-friends: 100
  request-expire-seconds: 120
  notify-on-join: true
  button-accept-color: "&a"
  button-deny-color: "&c"

# ── PlaceholderAPI ────────────────────────────────────────────────────────────
placeholders:
  top-cache-update-seconds: 300
  top-max-position: 10
  update-on-match-end: true
  placeholder-unknown-value: "—"

  match-timeout-minutes: 30
  stuck-arena-check-minutes: 5
  search-timeout-seconds: 60




# ── Version check ──────────────────────────────────────────────────────────────
version-check:
  use-viaversion: true
  fallback-to-server-version: true


# ── Menu display config ────────────────────────────────────────────────────────
menus:
  pvp-menu:
    unavailable-mode:
      material: RED_STAINED_GLASS_PANE
      use-original-icon: false
      name-suffix: " &8[&cНедоступно]"
      show-required-version: true

# ── Nametag display (над головой во время матча) ──────────────────────────────
# Плейсхолдеры: %lp_prefix%, %tier_color%, %tier%, %team_color%
# %lp_prefix%   — префикс из LuckPerms (если включён ниже)
# %tier_color%  — цвет тира из секции tiers.colors
# %tier%        — название тира (LT3, HT1 и т.д.)
# %team_color%  — цвет команды в дуэли (&9 синий, &c красный)
nametag:
  # ВНИМАНИЕ: если TAB уже показывает LP-префикс — поставьте false, иначе будет дубль
  include-luckperms-prefix: false
  health-below-name: true
  health-symbol: "&c❤"
  # Форматы для дуэлей и FFA
  duel-format: "%lp_prefix%%tier_color%[%tier%] %team_color%| "
  ffa-format: "%lp_prefix%%tier_color%[%tier%] &f| "
  # Форматы когда у игрока нет тира
  no-tier-duel-format: "%lp_prefix%%team_color%"
  no-tier-ffa-format: "%lp_prefix%"

# ── HUD / Action Bar ───────────────────────────────────────────────────────────
hud:
  # Пороги цвета пинга в action-bar HUD.
  #   0..good-max     → good-color   (по умолчанию зелёный)
  #   good-max..mid   → mid-color    (по умолчанию оранжевый)
  #   > mid           → bad-color    (по умолчанию красный)
  ping:
    good-max: 80
    mid-max: 150
    good-color: "&a"
    mid-color: "&6"
    bad-color: "&c"

# ── Custom Items ───────────────────────────────────────────────────────────────
custom-items:
  golden-head:
    enabled: true
    # Base64 texture value (player head skin)
    base64-texture: "eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvMWU1YmY2MDM2Mzg2YjJlYjAwZmMyZTYzNWU1NzViNzRlMmI1YTBjNjljYmI1MzY5MWFlZGZkYjZhMGMzNjAwOSJ9fX0="
    # Cooldown in seconds
    cooldown-seconds: 10
    effects:
      regeneration:
        amplifier: 2      # III = amplifier 2
        duration-seconds: 5
      absorption:
        amplifier: 0      # I = amplifier 0
        duration-seconds: 120
