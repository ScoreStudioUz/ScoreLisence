name: ScorePvP
version: 1.0.0
main: com.scorepvp.ScorePvP
api-version: '1.21'
authors: [ ScorePvP ]
description: Full PvP plugin — arenas, duels, parties, friends, placeholders
depend: [ ScoreLicense ]
softdepend: [ PlaceholderAPI, ViaVersion, WorldEdit, FastAsyncWorldEdit, TAB, LuckPerms ]

commands:
  scorepvp:
    description: Admin commands
    usage: /scorepvp <reload|version|setspawn|setregion|kit|giveitem>
    permission: scorepvp.admin
    aliases: [spvp]
  party:
    description: Party management
    usage: /party <invite|accept|leave|kick|disband|chat|promote|ffa>
    permission: scorepvp.use
    aliases: [p]
  kit:
    description: Kit commands
    usage: /kit <save|reset>
    permission: scorepvp.use
  tier:
    description: Tier management (admin)
    usage: /tier <set|remove|info> <player> [mode] [tier]
    permission: scorepvp.admin
  friends:
    description: Friends system
    usage: /friends <add|remove|list|accept|deny|requests>
    permission: scorepvp.use
    aliases: [fl, friend]
  duel:
    description: Duel another player
    usage: /duel <ник> | /duel accept [ник]
    permission: scorepvp.use
  spec:
    description: Spectate a match
    usage: /spec <ник>
    permission: scorepvp.use
  leave:
    description: Leave queue, match, or spectator
    usage: /leave
    permission: scorepvp.use
  msg:
    description: Send private message
    usage: /msg <ник> <сообщение>
    permission: scorepvp.use
    aliases: [w, tell]
  r:
    description: Reply to last DM
    usage: /r <сообщение>
    permission: scorepvp.use
  arena:
    description: Arena management
    usage: /arena <create|list|delete|<n> ...>
    permission: scorepvp.admin
  profile:
    description: View player profile
    usage: /profile [ник]
    permission: scorepvp.use
  cosmetics:
    description: Open cosmetics menu
    usage: /cosmetics [admin shield|armor ...]
    permission: duels.cosmetics
  kumush:
    description: Silver currency — balance / admin give-set-remove-look
    usage: /kumush [give|set|remove|look <nick> [amount]]
    permission: scorepvp.use
  stopduel:
    description: Force-end a player's duel as a draw (admin)
    usage: /stopduel <ник>
    permission: scorepvp.stopduel
    aliases: [duelstop]

permissions:
  scorepvp.admin:
    description: Full admin access
    default: op
  scorepvp.stopduel:
    description: Force-end any duel as a draw
    default: op
  scorepvp.use:
    description: Use ScorePvP features
    default: op
  scorepvp.party:
    description: Create and manage a party (invite/kick/promote/disband/chat/ffa). Joining a party does NOT need this.
    default: op
  scorepvp.party.tier1:
    description: Party size cap tier 1 (default 4 members).
    default: op
  scorepvp.party.tier2:
    description: Party size cap tier 2 (default 6 members).
    default: op
  scorepvp.party.tier3:
    description: Party size cap tier 3 (default 10 members).
    default: op
  scorepvp.kumush.admin:
    description: Give / set / remove / look up silver for any player (works offline)
    default: op
  duels.cosmetics:
    description: Use the /cosmetics menu and have selections applied at duel start
    default: op
  duels.cosmetics.admin:
    description: Manage cosmetic shields and armor pieces
    default: op
  duels.cosmetics.shields:
    description: Access the shields cosmetics category
    default: op
  duels.cosmetics.diamond:
    description: Access the diamond armor cosmetics category
    default: op
  duels.cosmetics.netherite:
    description: Access the netherite armor cosmetics category
    default: op
  duels.cosmetics.elytra:
    description: Access the lobby elytra + wind-charge cosmetic
    default: op
  duels.cosmetics.namecolor:
    description: Access the simple name-color category
    default: op
  duels.cosmetics.gradient:
    description: Access the gradient name-color category
    default: op
  duels.cosmetics.tiertag:
    description: Access the TierTag cosmetic (spawn/tab nick prefix)
    default: op
  duels.cosmetics.badges:
    description: Access the badges (nishonlar) category
    default: op
  # NOTE: colors.yml nick-color permissions are NOT listed here — ColorsManager
  # registers each one at runtime (default:false), so admins can add colors to
  # colors.yml without touching this file.
  scorepvp.kit.slot2:
    description: Unlock vanilla kit slot 2
    default: op
  scorepvp.kit.slot3:
    description: Unlock vanilla kit slot 3
    default: op
  scorepvp.kit.slot4:
    description: Unlock vanilla kit slot 4
    default: op
  scorepvp.kit.slot5:
    description: Unlock vanilla kit slot 5
    default: op
  scorepvp.kit.slot6:
    description: Unlock vanilla kit slot 6
    default: op
  scorepvp.hats.use:
    description: Open the /hats cosmetic hats menu
    default: op
  scorepvp.hats.all:
    description: Unlock every cosmetic hat at once
    default: op
  scorepvp.hats.admin:
    description: Reload the hats config (/hats reload)
    default: op
  duels.actionbar:
    description: Receive the combat action-bar HUD on every hit
    default: op
  duels.stats.accuracy:
    description: Show the accuracy line after each round
    default: op
  duels.stats.view:
    description: Show the [посмотреть] hoverable stats line after rounds and duels
    default: op
