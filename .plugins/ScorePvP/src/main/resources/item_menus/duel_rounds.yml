# ============================================================
#  Duel Rounds Selection GUI — item_menus/duel_rounds.yml
#  Configurable like DeluxeMenus: titles, items, lore
# ============================================================

title: "&0Duel: Raundlar"
size: 27

# Filler glass pane
filler:
  material: RED_STAINED_GLASS_PANE
  name: "&x&E&F&0&C&0&C&lU&x&F&3&1&5&1&5&lz&x&F&7&1&D&1&D&lP&x&F&B&2&6&2&6&lᴠ&x&F&F&2&E&2&E&lP &f- Serveri"

# Round option slots (row 2: 10-16)
round-slots:
  - 10
  - 11
  - 12
  - 13
  - 14
  - 15
  - 16

# Round values corresponding to each slot
round-values:
  - 1
  - 2
  - 4
  - 6
  - 10
  - 15
  - 20

# Default selected round count
default-rounds: 3

# ── Maxsus shlyapalar toggle (COAL) ──────────────────────────────────────────
# 4-slot (o'yinchi ko'rishida 5-chi katak). Bosilganda yoqiladi/o'chiriladi.
# Default O'CHIRILGAN. Yoqilganda COAL yonadi (glow) va nomida "Yoqilgan" deb
# turadi. Har bosishda UI button click ovozi chiqadi.
hats:
  slot: 4
  material: COAL
  # Qaysi shlyapa modelini COAL ko'rsatishi (hats.yml dagi id). Bo'sh — oddiy COAL.
  # Resource pack shu shlyapaning custom-model-data siga model bog'laydi.
  hat: ""
  name-on:  "&aMaxsus shlyapalar: &2&lYoqilgan"
  name-off: "&cMaxsus shlyapalar: &4&lO'chirilgan"
  lore:
    - "&7Duelda maxsus shlyapalar ishlatilsinmi."
    - "&7Kimda tanlangan shlyapa bo'lsa,"
    - "&7o'sha duelda kiyadi."
    - ""
    - "&eBosing — yoqish/o'chirish."

# Items for selected/unselected round
selected-material: MAP
unselected-material: PAPER

# Round item display
round-name: "&e{count} {word}"
round-lore-selected:
  - "&a▶ Tanlandi"
round-lore-unselected:
  - "&7Tanlash uchun bosing"

# Special button slots (row 3)
cancel-slot: 21
head-slot: 22
send-slot: 23

# Cancel button
cancel:
  material: BARRIER
  name: "&c&lBekor qilish"
  lore:
    - "&7Bekor qilish uchun bosing"

# Send button
send:
  material: GREEN_CONCRETE
  name: "&a&lDuel yuborish"
  lore:
    - "&7Duel yuborish uchun bosing"

# Player head (target skull)
head-slot-display:
  name: "&b{player}"
  lore:
    - "&7Duel uchun raqib"
