#  Duel Rounds Selection GUI — item_menus/duel_rounds.yml
#  Configurable like DeluxeMenus: titles, items, lore
# ============================================================

title: "&0Duel: Raundlar"
size: 27

# Filler glass pane
filler:
  material: RED_STAINED_GLASS_PANE
  name: "&x&E&F&0&C&0&C&lU&x&F&3&1&5&1&5&lz&x&F&7&1&D&1&D&lP&x&F&B&2&6&2&6&lᴠ&x&F&F&2&E&2&E&lP &f- Serveri"

# Round option slots (row 2: 10-16)
round-slots:
  - 10
  - 11
  - 12
  - 13
  - 14
  - 15
  - 16

# Round values corresponding to each slot
round-values:
  - 1
  - 2
  - 3
  - 5
  - 7
  - 10
  - 15

# Default selected round count
default-rounds: 3

# Items for selected/unselected round
selected-material: MAP
unselected-material: PAPER

# Round item display
round-name: "&e{count} {word}"
round-lore-selected:
  - "&a▶ Tanlandi"
round-lore-unselected:
  - "&7Tanlash uchun bosing"

# Special button slots (row 3)
cancel-slot: 21
head-slot: 22
send-slot: 23

# Cancel button
cancel:
  material: BARRIER
  name: "&c&lBekor qilish"
  lore:
    - "&7Bekor qilish uchun bosing"

# Send button
send:
  material: GREEN_CONCRETE
  name: "&a&lDuel yuborish"
  lore:
    - "&7Duel yuborish uchun bosing"

# Player head (target skull)
head-slot-display:
  name: "&b{player}"
  lore:
    - "&7Duel uchun raqib"
