title: "&0Profil: &b{player}"
size: 36

# Filler glass pane
filler:
  material: RED_STAINED_GLASS_PANE
  name: "&x&E&F&0&C&0&C&lU&x&F&3&1&5&1&5&lz&x&F&7&1&D&1&D&lP&x&F&B&2&6&2&6&lᴠ&x&F&F&2&E&2&E&lP &f- Serveri"

# Skull slot (player head with skin)
skull:
  slot: 4
  name: "&b{player}"
  lore:
    - "&7Holat: {status}"

# Playtime slot (clock)
playtime:
  slot: 3
  material: CLOCK
  name: "&eO'yin vaqti"
  lore:
    - "&7{hours}s {minutes}min"

# Overall stats slot (paper)
