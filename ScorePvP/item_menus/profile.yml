  slot: 5
  material: PAPER
  name: "&eUmumiy statistika"
  lore:
    - "&7G'alaba: &a{wins}"
    - "&7Mag'lubiyat: &c{losses}"
    - "&7Eng baland tier: {tier}"

# Mode tier item slots
