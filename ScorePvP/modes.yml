# ===============================================
#               UzPvP - Sozlamalar
# ===============================================
#
# Har bir rejim uchun ALOHIDA tier ranglari (tier-colors).
# Ikki format qo'llab-quvvatlanadi:
#   • Legacy rang kodi:     '&b'                          (butun tier matniga bitta rang)
#   • MiniMessage gradient: '<gradient:#9E9E9E:#FFFFFF>'  (matn bo'ylab o'tuvchi rang)
# Tier yorlig'i QAVSSIZ ko'rsatiladi — masalan "HT1" (avvalgidek "[HT1]" emas).
# Agar rejimda biror tier uchun rang berilmagan bo'lsa — config.yml dagi
# global `tiers.colors` ishlatiladi (fallback).
# DIQQAT: bu faqat KO'RINISH. Tier nomlari (LT5..HT1) bazada o'zgarmaydi.

sword:
  display-name: "&b&l🗡 Sword"
  icon: DIAMOND_SWORD
  icon-enchanted: false
  enabled: true
  kit-type: "sword"
  allowed-arenas: [sword1, sword2, sword3, sword4, sword5]
  default-rounds: 1
  countdown-seconds: 3
  min-client-version: "1.8.0"
  tier-colors:
    LT5: '<gradient:#9E9E9E:#FFFFFF>🗡 '
    HT5: '<gradient:#FFFFFF:#C8C8C8>🗡 '
    LT4: '<gradient:#7CFC00:#2E8B22>🗡 '
    HT4: '<gradient:#2E8B22:#0B6B0B>🗡 '
    LT3: '<gradient:#55FFFF:#1E90FF>🗡 '
    HT3: '<gradient:#1E90FF:#005FAF>🗡 '
    LT2: '<gradient:#FFE259:#FFA751>🗡 '
    HT2: '<gradient:#FFA751:#E0670C>🗡 '
    LT1: '<gradient:#FF7878:#D40000>🗡 '
    HT1: '<gradient:#D40000:#7A0000>🗡 '

