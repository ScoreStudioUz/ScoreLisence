# Tier hierarchy (weak → strong)
tiers:
  order:
  - LT5
  - HT5
  - LT4
  - HT4
  - LT3
  - HT3
  - LT2
  - HT2
  - LT1
  - HT1
  # GLOBAL (fallback) tier ranglari. Har bir rejim modes.yml dagi o'zining
  # `tier-colors` blokida bu ranglarni QAYTA YOZISHI mumkin. Agar rejimda
  # biror tier uchun rang bo'lmasa — shu yerdagi qiymat ishlatiladi.
  # Ikki format qo'llab-quvvatlanadi:
  #   • Legacy rang kodi:   '&b'                          (butun matnga bitta rang)
  #   • MiniMessage gradient: '<gradient:#9E9E9E:#FFFFFF>' (matn bo'ylab o'tuvchi rang)
  # Tier yorlig'i QAVSSIZ ko'rsatiladi — masalan "HT1".
  colors:
    HT1: '<gradient:#FFC107:#FFE082>'
    LT1: '<gradient:#FFEB3B:#FFF9C4>'
    HT2: '<gradient:#FFFFFF:#E0E0E0>'
    LT2: '<gradient:#B0BEC5:#ECEFF1>'
    HT3: '<gradient:#1E88E5:#90CAF9>'
    LT3: '<gradient:#4FC3F7:#E1F5FE>'
    HT4: '<gradient:#2196F3:#BBDEFB>'
    LT4: '<gradient:#5C6BC0:#C5CAE9>'
    HT5: '<gradient:#7E57C2:#D1C4E9>'
    LT5: '<gradient:#9575CD:#EDE7F6>'

# ── Party settings ─────────────────────────────────────────────────────────────
party:
  ffa-min-members: 2

# ── Match settings ─────────────────────────────────────────────────────────────
match:
  # Faqat BIRINCHI raund uchun sanab tushish (sekund). Keyingi raundlar
  # darhol "FIGHT!" bilan boshlanadi — sanash bo'lmaydi.
  countdown: 3
  round-end-delay-ticks: 60
  finish-delay-ticks: 60

# ── Arena (vanilla restore via diff-tracker + watchdog) ────────────────────────
arena:
  retry-search-ticks: 100 # ticks between arena search retries
  match-timeout-minutes: 30
  stuck-arena-check-minutes: 5
  search-timeout-seconds: 60

# ── Friends ────────────────────────────────────────────────────────────────────
friends:
  max-friends: 100
  request-expire-seconds: 120
  notify-on-join: true
  button-accept-color: '&a'
  button-deny-color: '&c'

# ── PlaceholderAPI ────────────────────────────────────────────────────────────
placeholders:
  top-cache-update-seconds: 300
  top-max-position: 10
  update-on-match-end: true
  placeholder-unknown-value: —

# ── Version check ──────────────────────────────────────────────────────────────
version-check:
  use-viaversion: true
  fallback-to-server-version: true


# ── Nametag display (над головой во время матча) ──────────────────────────────
# Плейсхолдеры: %lp_prefix%, %tier_color%, %tier%, %team_color%
# %lp_prefix%   — префикс из LuckPerms (если включён ниже)
# %tier_color%  — цвет тира из секции tiers.colors
# %tier%        — название тира (LT3, HT1 и т.д.)
# %team_color%  — цвет команды в дуэли (&9 синий, &c красный)
nametag:
  # ВНИМАНИЕ: если TAB уже показывает LP-префикс — поставьте false, иначе будет дубль
  include-luckperms-prefix: false
  # ── Под именем (BELOW_NAME slot) ──
  # Под ником каждого бойца отображается строка вида: "20 ❤ | 50ms"
  # — это ЕГО хп и ЕГО пинг (а не пинг наблюдателя). Реализовано через
  # Paper Score.numberFormat(FixedFormat): score-число (HP) маскируется
  # FixedFormat'ом, в котором сидит готовый Component с HP+ping.
  # Свой собственный пинг игрок видит в action bar (match.actionbar-hit).
  health-below-name: true
  # Шаблон того, что отрисовывается на BELOW_NAME под ником.
  # Плейсхолдеры:
  #   {hp}          — целое HP игрока, под чьим ником рендерится строка
  #   {max_hp}      — целое макс-HP того же игрока
  #   {hp_color}    — цвет HP по hud.health.* (зелёный/жёлтый/красный)
  #   {hp_symbol}   — символ сердца из health-symbol (по умолчанию ❤)
  #   {ping}        — пинг ТОГО ЖЕ игрока в миллисекундах
  #   {ping_color}  — цвет пинга по hud.ping.* (good/mid/bad)
  # Пустая строка → BELOW_NAME выключается совсем.
  below-name-format: '{hp_color}{hp}{hp_symbol} &7| {ping_color}{ping}ms'
  # Символ сердца, используется как {hp_symbol} в below-name-format.
  health-symbol: '&c❤'
  # Как часто (в тиках) перерисовывать BELOW_NAME (для актуального пинга).
  # 20 = раз в секунду. Дополнительно строка обновляется на каждом
  # событии урона — чтобы HP не отставало в бою.
  ping-refresh-ticks: 20
  # Форматы для дуэлей и FFA (tier QAVSSIZ ko'rsatiladi)
  duel-format: '%lp_prefix%%tier_color%%tier% %team_color%| '
  ffa-format: '%lp_prefix%%tier_color%%tier% &f| '
  # Форматы когда у игрока нет тира
  no-tier-duel-format: '%lp_prefix%%team_color%'
  no-tier-ffa-format: '%lp_prefix%'

  # ── Lobby nametag (duelda EMAS, oddiy spawnda boshi ustida) ──
  # O'yinchi duelda bo'lmaganda boshi ustidagi nik yoniga eng katta tieri
  # qo'shiladi: masalan "SHOXMONEY | HT1".  TAB borligida — TAB suffiksi orqali,
  # aks holda Bukkit scoreboard team suffiksi orqali qo'llanadi.
  # Plagin tier RANGini avtomatik qo'yadi (eng katta tier qaysi rejimники
  # bo'lsa, o'sha rejimning rangida).  {tier} — rangli tier yorlig'i (qavssiz).
  lobby-enabled: true
  # Nik bilan tier orasidagi qo'shimcha (suffix). {tier} — rangli tier.
  lobby-suffix-format: ' &7| {tier}'

# ── HUD / Action Bar ───────────────────────────────────────────────────────────
hud:
  # Пороги цвета пинга:
  #   0..good-max     → good-color   (по умолчанию зелёный)
  #   good-max..mid   → mid-color    (по умолчанию оранжевый)
  #   > mid           → bad-color    (по умолчанию красный)
  # Используются для below-name строки (nametag.below-name-format) и
  # для собственного HUD-индикатора пинга в action bar.
  ping:
    good-max: 80
    mid-max: 150
    good-color: '&a'
    mid-color: '&6'
    bad-color: '&c'
  # Цветовой градиент здоровья (доля HP/max_HP).
  # full-min ≤ frac          → full-color (по умолчанию зелёный)
  # mid-min  ≤ frac < full   → mid-color  (по умолчанию жёлтый)
  # frac < mid-min           → low-color  (по умолчанию красный)
  health:
    full-min: 0.66
    mid-min: 0.33
    full-color: '&a'
    mid-color: '&e'
    low-color: '&c'

